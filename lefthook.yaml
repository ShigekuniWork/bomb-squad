pre-commit:
  jobs:
    - name: betterleaks
      run: betterleaks git . --pre-commit --staged
    - name: golang-lint
      run: golangci-lint run ./...
    - name: golang-audit
      run: govulncheck ./...

commit-msg:
  jobs:
    - name: commit-message
      run: bash scripts/commit-message.sh "{1}"
